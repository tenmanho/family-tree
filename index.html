<script id="seed" type="application/json">{"version":1,"books":[]}</script><script>
'use strict';
const $=s=>document.querySelector(s), uid=()=> 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2), clone=x=>JSON.parse(JSON.stringify(x));
let panX=0,panY=0;
let data={version:1,books:[]}, bookId=null, selected=null, collapsed=new Set(), zoom=1, editing=null, all=[], parents=new Map();
let dirty=false, bandRows=[];
const CACHE_KEY="genealogy-import-cache-v1";
function valid(d){if(!d||d.version!==1||!Array.isArray(d.books)||!d.books.length)throw Error('不是本工具的族譜備份');let count=0;const ids=new Set();function walk(n,depth){if(depth>150||++count>30000)throw Error('資料過大或層級過深');if(!n||typeof n.id!=='string'||ids.has(n.id)||!n.attrs||typeof n.attrs!=='object'||Array.isArray(n.attrs)||!Array.isArray(n.children))throw Error('人物資料格式或識別碼有誤');ids.add(n.id);for(const [k,v]of Object.entries(n.attrs))if(!/^[A-Za-z_][\w.-]*$/.test(k)||typeof v!=='string')throw Error('欄位格式有誤');n.children.forEach(c=>walk(c,depth+1))}const bi=new Set();d.books.forEach(b=>{ids.clear();if(!b||typeof b.id!=='string'||bi.has(b.id)||typeof b.name!=='string'||!b.attrs||typeof b.attrs!=='object'||Array.isArray(b.attrs)||!Array.isArray(b.people))throw Error('族譜格式有誤');bi.add(b.id);for(const[k,v]of Object.entries(b.attrs))if(!/^[A-Za-z_][\w.-]*$/.test(k)||typeof v!=='string')throw Error('族譜欄位格式有誤');b.people.forEach(n=>walk(n,0))});return d}
function book(){return data.books.find(b=>b.id===bookId)}function spouse(n){return n.attrs.L103==='配偶'}function name(n){return (n.attrs.L201||'').trim()+(n.attrs.L202||'').trim()||'未命名'}
function plain(s){let doc=new DOMParser().parseFromString(s||'','text/html');return doc.body.textContent.trim()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').style.display='none',3200)}
function persist(){try{localStorage.setItem(CACHE_KEY,JSON.stringify(data));dirty=false;$('#status').textContent='已自動儲存於此瀏覽器 · '+new Date().toLocaleTimeString('zh-TW')+' · 可另行備份檔案。';return true}catch(e){dirty=true;$('#status').textContent='本機儲存未成功，請按「備份檔案」保存修改。';toast('本機空間不足或無法使用，請備份檔案');return false}}
function save(){persist();refresh()}
function index(){all=[];parents=new Map();function rec(n,p){all.push(n);parents.set(n.id,p);n.children.forEach(c=>rec(c,n))}book().people.forEach(n=>rec(n,null))}
function find(id){return all.find(n=>n.id===id)}function kids(n){return n.children.flatMap(c=>spouse(c)?c.children:[c])}function family(n){return [n,...n.children.filter(spouse)]}
function init(){index();resetFolds();selected=all[0]?.id;refresh();if(selected)choose(selected)}
function depth(n){let d=0;while(parents.get(n.id)){n=parents.get(n.id);if(!spouse(n))d++}return d}
function bookLabel(b){return (b.attrs.M103||b.name||'族譜').trim()}
function viewRoots(){return book().people}
function effectiveGeneration(n){return (n.attrs.L101||'').trim()||(spouse(n)?(parents.get(n.id)?.attrs.L101||'').trim():'')}
function viewPeople(){return all}
function resetFolds(){collapsed=new Set();function walk(n,d){if(d>1)collapsed.add(n.id);kids(n).forEach(c=>walk(c,d+1))}viewRoots().forEach(n=>walk(n,0))}

function historySection(key,value){
 const lines=value.replace(/\r/g,'').split('\n');while(lines.length&&!lines[0].trim())lines.shift();while(lines.length&&!lines.at(-1).trim())lines.pop();
 if(!lines.length)return '';
 const titled=['M111B','M111E','M120'].includes(key);const title=titled?lines.shift().trim():'其他記載';
 let content='';
 if(key==='M111B'){
  const entries=[];for(const line of lines){const t=line.trim();if(!t)continue;if(/^[一二三四五六七八九十百零〇\d]+世/.test(t)||!entries.length)entries.push(t);else entries[entries.length-1]+=t}
  content=entries.map(t=>{const i=t.indexOf('：');return i<0?`<p>${esc(t)}</p>`:`<div class="history-entry"><h4>${esc(t.slice(0,i))}</h4><p>${esc(t.slice(i+1))}</p></div>`}).join('');
 }else if(key==='M111E'){
  const blocks=[];let buffer='';function flush(){if(buffer){blocks.push({text:buffer});buffer=''}}
  for(const line of lines){const t=line.trim();if(!t){flush();continue}if(/^[\s\u3000]{8,}/.test(line)){flush();blocks.push({text:t,credit:true});continue}if(/^[\s\u3000]/.test(line))flush();buffer+=t}flush();
  content=blocks.map(b=>{if(b.credit)return `<p class="history-credit">${esc(b.text)}</p>`;const sentences=b.text.match(/[^。！？]*[。！？]|[^。！？]+$/g)||[b.text];const groups=[];let part='';for(const sentence of sentences){part+=sentence;if(part.length>=160){groups.push(part);part=''}}if(part)groups.push(part);return groups.map(t=>`<p>${esc(t)}</p>`).join('')}).join('');
 }else if(key==='M120')content='<ul class="ancestor-notes">'+lines.filter(l=>l.trim()).map(l=>`<li>${esc(l.trim().replace(/[\s\u3000]+/g,' '))}</li>`).join('')+'</ul>';
 else content=lines.join('\n').split(/\n\s*\n/).filter(t=>t.trim()).map(t=>`<p class="history-original">${esc(t.trim())}</p>`).join('');
 return `<section class="history-section"><h3>${esc(title)}</h3>${content}</section>`;
}
function renderHistory(){const attrs=book().attrs;const labels={M102:'堂號',M103:'譜名',M104:'祖籍',M105:'始祖記載',M106:'地名記載'};const meta=Object.entries(labels).filter(([key])=>attrs[key]?.trim()).map(([key,label])=>`<div><dt>${label}</dt><dd>${esc(attrs[key].trim().replace(/[\s\u3000]+/g,' '))}</dd></div>`).join('');const sections=Object.entries(attrs).filter(([k,v])=>!labels[k]&&v.trim()).map(([k,v])=>historySection(k,v)).join('');$('#history').innerHTML=(meta?`<dl class="history-meta">${meta}</dl>`:'')+sections||'<p class="history-empty">這本族譜尚無沿革與原始記載。</p>'}

function generationOptionsCount(){return new Set(all.filter(n=>!spouse(n)).map(n=>(n.attrs.L101||'').trim()).filter(Boolean)).size}
function refresh(){index();$('#familyLogo').textContent=bookLabel(data.books[0]);$('#familySubtitle').textContent=[data.books[0].attrs.M102,`${generationOptionsCount()} 個世代`].filter(Boolean).join(' · ');$('#scopeTitle').textContent='全族';$('#title').textContent=bookLabel(book());$('#count').textContent=viewPeople().length;renderHistory();results();draw();detail()}
function results(){const q=$('#search').value.trim().toLowerCase();const list=viewPeople().filter(n=>!q||Object.values(n.attrs).some(v=>plain(v).toLowerCase().includes(q)));$('#resultCount').textContent=q?`找到 ${list.length} 位`:`人物名錄 · 共 ${list.length} 位`;$('#results').innerHTML=list.map(n=>`<button class="result ${selected===n.id?'active':''}" data-select="${esc(n.id)}"><span class="result-name ${genderClass(n)}">${esc(name(n))}</span><small>${esc(n.attrs.L101|| (spouse(n)?'配偶':''))}</small></button>`).join('')||'<p class="hint">沒有符合的人物</p>'}
function genderClass(n){return n.attrs.L208==='男'?'gender-male':n.attrs.L208==='女'?'gender-female':'gender-unknown'}
function lifeYears(n){const clean=v=>!v||/^0+$/.test(v.trim())?'':v.trim();const birth=clean(n.attrs.L210),death=clean(n.attrs.L211);return birth&&death?birth+' – '+death:birth?'生 '+birth:death?'卒 '+death:''}
function draw(){const roots=viewRoots(),positions=[],edges=[],widths=new Map(),bands=[];const fw=n=>family(n).length*58-10;
function measure(n,d){const ch=collapsed.has(n.id)?[]:kids(n);const w=Math.max(fw(n)+30,ch.reduce((sum,c)=>sum+measure(c,d+1),0));widths.set(n.id,w);if(!bands[d])bands[d]=n.attrs.L101||'世代未記載';return w}let total=roots.reduce((sum,n)=>sum+measure(n,0),0)+65;
function place(n,d,left){const w=widths.get(n.id),x=left+w/2-fw(n)/2,y=30+d*210;positions.push({n,x,y});let off=left;for(const c of collapsed.has(n.id)?[]:kids(n)){edges.push({x:x+24,y:y+162,cx:off+widths.get(c.id)/2-fw(c)/2+24,cy:y+210,label:family(n).length>2?name(parents.get(c.id)):''});place(c,d+1,off);off+=widths.get(c.id)}}let off=65;roots.forEach(n=>{place(n,0,off);off+=widths.get(n.id)});const scene=$('#scene');scene.style.width=Math.max(total,300)+'px';scene.style.height=Math.max(bands.length*210,300)+'px';bandRows=bands.map((label,d)=>({label,y:30+d*210}));scene.innerHTML=bands.map((label,d)=>`<div class="generation-band" style="top:${10+d*210}px;width:${total}px"></div>`).join('')+`<svg width="${Math.max(total,300)}" height="${Math.max(bands.length*210,300)}">${edges.map(e=>`<path d="M${e.x} ${e.y} V${e.cy-22} H${e.cx} V${e.cy}" fill="none" stroke="#8c7a55" stroke-width="1.4"/>${e.label?`<text x="${e.cx+5}" y="${e.cy-6}" fill="#81705a" font-size="10">${esc(e.label)}子女</text>`:''}`).join('')}</svg>`+positions.map(({n,x,y})=>`<div class="family" style="left:${x}px;top:${y}px;width:${fw(n)}px;height:162px">${family(n).map((p,i)=>`<button class="person ${genderClass(p)} ${selected===p.id?'selected':''}" data-select="${esc(p.id)}" title="${esc(name(p)+' '+lifeYears(p))}" aria-label="${esc(name(p)+(i?'，配偶':''))}"><strong>${esc(name(p))}</strong><small>${i?'配偶':esc(p.attrs.L101||'')}</small></button>`).join('')}${kids(n).length?`<button class="fold" data-fold="${esc(n.id)}">${collapsed.has(n.id)?'＋':'−'} ${kids(n).length} 位子女</button>`:''}</div>`).join('')+(all.length?'':'<p>這本族譜尚無人物，請點「新增人物」。</p>');applyZoom()}
function applyZoom(){$('#scene').style.transform=`scale(${zoom})`;$('#chart').style.transform=`translate(${panX}px,${panY}px)`;$('#scale').textContent=Math.round(zoom*100)+'%';$('#bandLabels').innerHTML=bandRows.map(b=>`<div class="generation-tag" style="top:${panY+(b.y-26)*zoom}px"><span>${esc(b.label)}</span><small>${all.filter(n=>effectiveGeneration(n)===b.label).length} 人</small></div>`).join('')}

function centerSelected(){const el=Array.from(document.querySelectorAll('.person')).find(e=>e.dataset.select===selected);if(!el)return;const card=el.closest('.family'),v=$('#viewport');panX=v.clientWidth/2-(parseFloat(card.style.left)+el.offsetLeft+24)*zoom;panY=Math.max(35,v.clientHeight/3)-(parseFloat(card.style.top)+el.offsetTop)*zoom;applyZoom()}
function setZoom(value,x=$('#viewport').clientWidth/2,y=$('#viewport').clientHeight/2){const next=Math.max(.3,Math.min(1.8,value)),ratio=next/zoom;panX=x-(x-panX)*ratio;panY=y-(y-panY)*ratio;zoom=next;applyZoom()}
function choose(id){selected=id;let p=find(id);while(p){collapsed.delete(p.id);p=parents.get(p.id)}draw();detail();results();requestAnimationFrame(centerSelected)}
function detail(){const n=find(selected);if(!n){$('#detail').innerHTML='<h2>人物資料</h2><p class="hint">點選族譜中的人物。</p>';return}const p=parents.get(n.id);$('#detail').innerHTML=`<span class="badge">${esc(n.attrs.L101|| (spouse(n)?'配偶':'族人'))}</span><h2 class="person-heading ${genderClass(n)}">${esc(name(n))}</h2><div class="hint">${esc(n.attrs.L207||'')}</div><dl><dt>性別</dt><dd>${esc(n.attrs.L208||'未記載')}</dd><dt>生卒年</dt><dd>${esc(lifeYears(n))}</dd><dt>${spouse(n)?'配偶':'上代（原檔所屬）'}</dt><dd>${p?esc(name(p)):'族譜起始人物'}</dd><dt>備註／生平</dt><dd>${esc(plain(n.attrs.L213)||'尚無記載')}</dd></dl><div class="actions"><button data-action="edit">修改</button><button class="danger" data-action="delete">刪除</button></div><div class="actions" style="margin-top:8px"><button data-action="child">＋ 子女</button>${spouse(n)?'':'<button data-action="spouse">＋ 配偶</button>'}</div><p class="hint">新增子女時，選取父母中的所屬人物。若有多位配偶，請選取對應配偶再新增子女。</p>`}
function openEditor(mode){const n=find(selected);editing={mode,id:n?.id};$('#form').reset();$('#formTitle').textContent=({edit:'修改人物',child:'新增子女',spouse:'新增配偶',root:'新增起始人物'})[mode];for(const el of $('#form').elements)if(el.name)el.value=mode==='edit'?(el.name==='L213'?plain(n.attrs[el.name]):n.attrs[el.name]||''):'';$('#relationHint').textContent=mode==='root'?'新增為本譜的獨立起始人物。':mode==='edit'?'保留原始親屬關係與其他未顯示欄位。':`所屬人物：${name(n)}`;$('#editor').showModal()}
$('#form').onsubmit=e=>{e.preventDefault();const {mode,id}=editing,n=find(id);let target=mode==='edit'?n:{id:uid(),attrs:{L103:mode==='spouse'?'配偶':'一般',L103AA:'嫁娶',L103BA:mode==='spouse'?'':'親生'},children:[]};const fd=new FormData(e.target);if(!String(fd.get('L202')).trim())return toast('請填寫名字');for(const[k,v]of fd){if(k==='L213'&&mode==='edit'&&v===plain(target.attrs.L213))continue;target.attrs[k]=k==='L213'?esc(v):v}if(mode!=='edit'){if(mode==='root')book().people.push(target);else n.children.push(target)}selected=target.id;$('#editor').close();save();choose(target.id);toast('人物已儲存')};
$('#detail').onclick=e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;if(action==='delete'){const n=find(selected);if(n.children.length){alert('此人物仍連結配偶或子女，請先從最末端處理相關人物，再刪除此人物。這可避免誤刪整個支系。');return}if(!confirm(`確定刪除「${name(n)}」？此操作無法復原，建議先匯出備份。`))return;const p=parents.get(n.id),arr=p?p.children:book().people;arr.splice(arr.indexOf(n),1);selected=p?.id||null;save();toast('人物已刪除')}else openEditor(action)};
document.addEventListener('click',e=>{const select=e.target.closest('[data-select]');if(select)choose(select.dataset.select);const fold=e.target.closest('[data-fold]');if(fold){const id=fold.dataset.fold;collapsed.has(id)?collapsed.delete(id):collapsed.add(id);draw()}});
$('#search').oninput=results;$('#addRoot').onclick=()=>openEditor('root');$('#cancel').onclick=()=>$('#editor').close();$('#less').onclick=()=>setZoom(zoom-.1);$('#more').onclick=()=>setZoom(zoom+.1);$('#resetZoom').onclick=()=>setZoom(1);$('#center').onclick=()=>choose(selected);$('#expand').onclick=()=>{collapsed.clear();draw()};$('#collapse').onclick=()=>{resetFolds();draw()};
function download(text,filename,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
$('#exportJson').onclick=()=>{download(JSON.stringify(data,null,2),'族譜備份-'+new Date().toISOString().slice(0,10)+'.json','application/json');dirty=false};
$('#historyBtn').onclick=()=>{$('#historyBook').textContent=bookLabel(book());$('#historyDialog').showModal();$('#historyDialog').scrollTop=0};$('#closeHistory').onclick=()=>$('#historyDialog').close();
$('#importBtn').onclick=()=>$('#importDialog').showModal();$('#closeImport').onclick=()=>$('#importDialog').close();
function fromXML(text,title){if(/<!DOCTYPE/i.test(text))throw Error('不支援含外部定義的 XML');const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.querySelector('parsererror')||doc.documentElement.tagName!=='root')throw Error('XML 格式不符，需使用原始族譜格式');const attrs=el=>Object.fromEntries(Array.from(el.attributes).map(a=>[a.name,a.value]));function rec(el){if(el.tagName!=='person')throw Error('XML 含不支援的節點');return{id:uid(),attrs:attrs(el),children:Array.from(el.children).map(rec)}}return{id:uid(),name:title,attrs:attrs(doc.documentElement),people:Array.from(doc.documentElement.children).map(rec)}}
async function importFiles(files,initial=false){if(!files.length)return false;try{let incoming=[];for(const f of files){if(f.size>20*1024*1024)throw Error('單一檔案不可超過 20 MB');if(initial&&!/\.json$/i.test(f.name))throw Error('請選擇 JSON 族譜資料檔');const bytes=await f.arrayBuffer();let text=new TextDecoder().decode(bytes).replace(/^\uFEFF/,'');if(/\.xml$/i.test(f.name)){const enc=text.match(/encoding\s*=\s*["']([^"']+)/i)?.[1]||'utf-8';text=new TextDecoder(enc,{fatal:true}).decode(bytes);incoming.push(fromXML(text,f.name.replace(/\.xml$/i,'')))}else incoming.push(...valid(JSON.parse(text)).books)}valid({version:1,books:incoming});incoming=clone(incoming);if(incoming.length>1){const main=incoming.filter(b=>b.name==='族譜'||b.attrs.M103==='族譜');if(main.length!==1)throw Error('請匯入只包含一本族譜的資料檔');incoming=main}for(const b of incoming)b.id=uid();data={version:1,books:incoming};bookId=incoming[0].id;$('#search').value='';panX=0;panY=0;zoom=1;document.body.classList.add('loaded');$('#uploadError').textContent='';init();persist();$('#importDialog').close();toast(`已載入 ${incoming.length} 本族譜，取代原有資料`);return true}catch(err){const message='匯入失敗：'+err.message;if(initial)$('#uploadError').textContent=message;else alert(message);return false}}
$('#file').onchange=async e=>{await importFiles(Array.from(e.target.files));e.target.value=''};
$('#pickFile').onclick=()=>$('#initialFile').click();
$('#initialFile').onchange=async e=>{await importFiles(Array.from(e.target.files),true);e.target.value=''};
const dropzone=$('#dropzone');let dragDepth=0;
dropzone.addEventListener('dragenter',e=>{e.preventDefault();dragDepth++;dropzone.classList.add('drag-over')});
dropzone.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy'});
dropzone.addEventListener('dragleave',e=>{e.preventDefault();if(--dragDepth<=0){dragDepth=0;dropzone.classList.remove('drag-over')}});
dropzone.addEventListener('drop',async e=>{e.preventDefault();dragDepth=0;dropzone.classList.remove('drag-over');await importFiles(Array.from(e.dataTransfer.files),true)});
window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

// Move the chart only by dragging its blank area with the primary button.
const viewport=$('#viewport');let drag=null,suppressClick=false;
function endPan(){if(drag&&viewport.hasPointerCapture(drag.id))viewport.releasePointerCapture(drag.id);drag=null;viewport.classList.remove('panning')}
window.addEventListener('blur',endPan);
viewport.addEventListener('wheel',e=>{e.preventDefault();const rect=viewport.getBoundingClientRect();const delta=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?viewport.clientHeight:1);setZoom(zoom*Math.exp(-Math.max(-200,Math.min(200,delta))*.002),e.clientX-rect.left,e.clientY-rect.top)},{passive:false});
viewport.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0||e.target.closest('button,input,select,textarea,a'))return;e.preventDefault();suppressClick=false;drag={id:e.pointerId,x:e.clientX,y:e.clientY,px:panX,py:panY,moved:false};viewport.setPointerCapture(e.pointerId);viewport.classList.add('panning')});
viewport.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>3)drag.moved=true;panX=drag.px+dx;panY=drag.py+dy;applyZoom()});
viewport.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;suppressClick=drag.moved;endPan();setTimeout(()=>{suppressClick=false},0)});
viewport.addEventListener('pointercancel',endPan);viewport.addEventListener('lostpointercapture',()=>{drag=null;viewport.classList.remove('panning')});
viewport.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopImmediatePropagation();suppressClick=false}},true);

try{const cached=localStorage.getItem(CACHE_KEY);if(cached){data=valid(JSON.parse(cached));bookId=data.books[0].id;document.body.classList.add('loaded');init();$('#status').textContent='已載入本機快取 · 修改後自動儲存。'}}catch(e){data={version:1,books:[]};bookId=null;$('#uploadError').textContent='無法讀取本機快取，請重新匯入 JSON 資料檔。'}
</script></body></html>
